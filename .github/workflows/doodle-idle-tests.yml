name: Doodle Idle Unity tests

on:
  push:
    paths: ['Assets/**', 'Packages/**', 'ProjectSettings/**', '.github/workflows/doodle-idle-tests.yml', '.github/unity-test-filters.json']
  pull_request:
    paths: ['Assets/**', 'Packages/**', 'ProjectSettings/**', '.github/workflows/doodle-idle-tests.yml', '.github/unity-test-filters.json']
  workflow_dispatch:
    inputs:
      validation:
        description: Validation scope
        type: choice
        default: full
        options:
          - full
          - ascension
          - ascension-boss
          - ascension-refinements
          - performance-numbers
          - costume-body
          - necklace-editor
          - equipment-growth-summon
          - ascension-cherry
          - ascension-combat
          - ascension-art
          - red-sword
          - hit-ui
          - summon-payment
          - damage-percent
          - balance-start
          - stat-costs
          - balance-numeric
          - quest-bulk
          - day-one
          - campaign
          - campaign-only
          - combat-clock
          - terrain
          - companion-impacts
          - enemy-dash
          - stage-unlocks
          - skill-unlocks
          - equipment-art
          - summon-rates
          - stage-debug
          - notifications-dungeons
          - dungeon-expansion

permissions:
  contents: read
  checks: write

concurrency:
  group: doodle-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playmode:
    # Same-repository PR heads already run on push. Avoid duplicate Unity activation/renders.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Unity 6 collision and combat tests
    runs-on: ubuntu-latest
    timeout-minutes: ${{ startsWith(inputs.validation, 'campaign') && 120 || 35 }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check Unity activation configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Set UNITY_EMAIL and UNITY_PASSWORD repository Actions secrets. See Documentation/CI.md."
            exit 1
          fi
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Set UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro). See Documentation/CI.md."
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: Library
          key: doodle-Linux-6000.3.8f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: doodle-Linux-6000.3.8f1-
      # v4.4 delegates to a CLI that rejects --no-coverageEnabled; keep the working runner implementation.
      - name: Select validation scope
        id: validation
        env:
          VALIDATION: ${{ inputs.validation || 'full' }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          filters = json.loads(Path('.github/unity-test-filters.json').read_text())
          scope = os.environ['VALIDATION']
          prefix = '-dayOneCampaign ' if scope.startswith('campaign') else ''
          parameters = prefix + '-testFilter ' + filters.get(scope, 'DoodleIdle.Tests')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('parameters=' + parameters + '\n')
          PY
      - uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.3.8f1
          testMode: PlayMode
          customParameters: ${{ steps.validation.outputs.parameters }}
          coverageOptions: assemblyFilters:+DoodleIdle.Runtime;generateAdditionalMetrics
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Doodle Idle combat results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doodle-idle-test-results
          path: artifacts
          if-no-files-found: ignore
