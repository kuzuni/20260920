name: Doodle Idle Unity tests

on:
  push:
    paths: ['Assets/**', 'Packages/**', 'ProjectSettings/**', '.github/workflows/doodle-idle-tests.yml']
  pull_request:
    paths: ['Assets/**', 'Packages/**', 'ProjectSettings/**', '.github/workflows/doodle-idle-tests.yml']
  workflow_dispatch:
    inputs:
      validation:
        description: Validation scope
        type: choice
        default: full
        options:
          - full
          - red-sword
          - hit-ui
          - day-one
          - campaign
          - terrain
          - companion-impacts
          - enemy-dash
          - stage-unlocks
          - notifications-dungeons

permissions:
  contents: read
  checks: write

concurrency:
  group: doodle-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playmode:
    # Same-repository PR heads already run on push. Avoid duplicate Unity activation/renders.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Unity 6 collision and combat tests
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.validation == 'campaign' && 120 || 35 }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check Unity activation configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Set UNITY_EMAIL and UNITY_PASSWORD repository Actions secrets. See Documentation/CI.md."
            exit 1
          fi
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Set UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro). See Documentation/CI.md."
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: Library
          key: doodle-Linux-6000.3.8f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: doodle-Linux-6000.3.8f1-
      # v4.4 delegates to a CLI that rejects --no-coverageEnabled; keep the working runner implementation.
      - uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.3.8f1
          testMode: PlayMode
          customParameters: ${{ inputs.validation == 'campaign' && '-dayOneCampaign' || '' }} -testFilter ${{ inputs.validation == 'campaign' && 'DoodleIdle.Tests' || inputs.validation == 'day-one' && 'DoodleIdle.Tests.DoodleIdlePlayModeTests.DayOneCurrencyClaimsMileageTransactionsAndCardPersist;DoodleIdle.Tests.DoodleIdlePlayModeTests.DayOneHistorySurvivesResetPeriodsAndDefeatKeepsUnlocks;DoodleIdle.Tests.DoodleIdlePlayModeTests.DayOneGrowthBudgetAndLiveStage300Combat;DoodleIdle.Tests.DoodleIdlePlayModeTests.DayOneSkillLevelAndDisplayedHitUseTheSameDamageCoefficient;DoodleIdle.Tests.DoodleIdlePlayModeTests.UiMainMissionPaysTicketsOnceAndResumesTheSavedNextObjective;DoodleIdle.Tests.DoodleIdlePlayModeTests.RevisionSummonLevelsUnlockGradesAndRelicsStayUniformWithoutLevels;DoodleIdle.Tests.DoodleIdlePlayModeTests.GrowthLegacyDefenseAndSpeedMigrateOnceWithoutOverwritingNewStatKeys;DoodleIdle.Tests.DoodleIdlePlayModeTests.RevisionCriticalLockRefundTracksPricesAndSkillSlotsStayInOneRow;DoodleIdle.Tests.DoodleIdlePlayModeTests.NewSkillSplashesKeepDirectDamageScaleNeighborsAndEmitOnRealHits;DoodleIdle.Tests.DoodleIdlePlayModeTests.CannonDustAndGoldUseVisibleParticlesWithHandDrawnHealthFeedback;DoodleIdle.Tests.DoodleIdlePlayModeTests.EnemyDashPreparesChargesWithFacingTrailsThenReturnsToMovement;DoodleIdle.Tests.DoodleIdlePlayModeTests.ExpansionCatalogsDetailScaleAndSummonRowsKeepTheirLayout;DoodleIdle.Tests.DoodleIdlePlayModeTests.FiveWaveSnakesEmergeAndAttachedSnakeRetargetsWhileRootFollowsPlayer;DoodleIdle.Tests.DoodleIdlePlayModeTests.SkillSlotsUnlockAtStageBoundariesAndSavedLoadoutsRespectProgress;DoodleIdle.Tests.DoodleIdlePlayModeTests.UiDungeonsSpendIndependentThreeAttemptsAndRewardOnlyRealKillCompletion' || inputs.validation == 'hit-ui' && 'DoodleIdle.Tests.DoodleIdlePlayModeTests.ContactDamageUsesSharedOneSecondImmunityBlinkAndAllEnemyKinds;DoodleIdle.Tests.DoodleIdlePlayModeTests.NotificationBadgesFollowClaimsAndAvailableCollectionActions;DoodleIdle.Tests.DoodleIdlePlayModeTests.UiNavigationTabsLoadoutsAndStatPurchasesUseLiveState;DoodleIdle.Tests.DoodleIdlePlayModeTests.RevisionEquipmentCapsSynthesisChainAndGodUpgrades;DoodleIdle.Tests.DoodleIdlePlayModeTests.DungeonRelicsAreExclusiveUniformPersistentAndShareTheirOptions' || inputs.validation == 'red-sword' && 'DoodleIdle.Tests.DoodleIdlePlayModeTests.DragonFlapsAndRedWaveFiresFiveAnimatedWideWavesAtNormalSpeed;DoodleIdle.Tests.DoodleIdlePlayModeTests.SummonSkillsExportSeparateReadableCombatFrames' || inputs.validation == 'notifications-dungeons' && 'DoodleIdle.Tests.DoodleIdlePlayModeTests.NotificationBadgesFollowClaimsAndAvailableCollectionActions;DoodleIdle.Tests.DoodleIdlePlayModeTests.DungeonEntrySettlesPendingFieldGoldBeforeChangingRewardContext;DoodleIdle.Tests.DoodleIdlePlayModeTests.DungeonRelicsAreExclusiveUniformPersistentAndShareTheirOptions;DoodleIdle.Tests.DoodleIdlePlayModeTests.DungeonEntryReplacesActualMapAndActorsAndUsesMainStageDifficulty;DoodleIdle.Tests.DoodleIdlePlayModeTests.UiDungeonsSpendIndependentThreeAttemptsAndRewardOnlyRealKillCompletion;DoodleIdle.Tests.DoodleIdlePlayModeTests.UiRealKillsAdvanceMainStagesButActiveDungeonKillsOnlyAdvanceThatDungeon;DoodleIdle.Tests.DoodleIdlePlayModeTests.EnemyDashPreparesChargesWithFacingTrailsThenReturnsToMovement;DoodleIdle.Tests.DoodleIdlePlayModeTests.EquipmentAndSkinSelectionsSlideBothDirectionsWhilePaused;DoodleIdle.Tests.DoodleIdlePlayModeTests.GameInfoResetClearsOnlyGameKeysAndRestoresStarterCatalog' || inputs.validation == 'terrain' && 'DoodleIdle.Tests.DoodleIdlePlayModeTests.ExpansionGroundUsesContinuousOpaqueWorldPatternAcrossFormerSeams' || inputs.validation == 'companion-impacts' && 'DoodleIdle.Tests.DoodleIdlePlayModeTests.CompanionAndSkillArtHasDistinctCompleteFramesAndExportsBothPoses' || inputs.validation == 'enemy-dash' && 'DoodleIdle.Tests.DoodleIdlePlayModeTests.EnemyDashPreparesChargesWithFacingTrailsThenReturnsToMovement;DoodleIdle.Tests.DoodleIdlePlayModeTests.ContactDamageUsesSharedOneSecondImmunityBlinkAndAllEnemyKinds' || inputs.validation == 'stage-unlocks' && 'DoodleIdle.Tests.DoodleIdlePlayModeTests.EnemyDashPreparesChargesWithFacingTrailsThenReturnsToMovement;DoodleIdle.Tests.DoodleIdlePlayModeTests.ContactDamageUsesSharedOneSecondImmunityBlinkAndAllEnemyKinds;DoodleIdle.Tests.DoodleIdlePlayModeTests.SkillSlotsUnlockAtStageBoundariesAndSavedLoadoutsRespectProgress;DoodleIdle.Tests.DoodleIdlePlayModeTests.LoadoutOnlyEquippedSkillsCastAndUnequipCancelsQueuedShots;DoodleIdle.Tests.DoodleIdlePlayModeTests.FullLoadoutsReplaceThroughTheirExistingSlotsAndEmptySlotsShowPlus;DoodleIdle.Tests.DoodleIdlePlayModeTests.UiNavigationTabsLoadoutsAndStatPurchasesUseLiveState;DoodleIdle.Tests.DoodleIdlePlayModeTests.AutomaticCombatCastsEquippedLoadoutsAndRefills;DoodleIdle.Tests.DoodleIdlePlayModeTests.GameInfoResetClearsOnlyGameKeysAndRestoresStarterCatalog;DoodleIdle.Tests.DoodleIdlePlayModeTests.SkillDebugButtonsCanCastAllUnownedSkillsWithoutChangingLoadoutOrWallet' || 'DoodleIdle.Tests' }}
          coverageOptions: assemblyFilters:+DoodleIdle.Runtime;generateAdditionalMetrics
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Doodle Idle combat results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doodle-idle-test-results
          path: artifacts
          if-no-files-found: ignore
